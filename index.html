
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roastery Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f1e9;
      color: #30251e;
      font-family: Arial, sans-serif;
    }
    header {
      background: #38261d;
      color: white;
      padding: 24px;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #e5d7c8; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    #status {
      padding: 12px 15px;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      padding: 11px 15px;
      background: #e5d8c7;
      color: #30251e;
      font-weight: 600;
    }
    button.active, button.primary {
      background: #765139;
      color: white;
    }
    button.danger { background: #a3332a; color: white; }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0000000b;
    }
    h2 { margin-top: 0; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    label { display: block; font-size: 14px; font-weight: bold; }
    input, textarea, select {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      border: 1px solid #d8cec2;
      border-radius: 7px;
      font: inherit;
      background: white;
    }
    textarea { min-height: 75px; resize: vertical; }
    .form-actions { margin-top: 16px; display: flex; gap: 10px; }
    .records { display: grid; gap: 12px; }
    .record {
      border: 1px solid #eee4d9;
      border-radius: 9px;
      padding: 14px;
      overflow-wrap: anywhere;
    }
    .record h3 { margin: 0 0 8px; }
    .record pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      color: #594b40;
    }
    .record-actions { text-align: right; }
    .muted { color: #776b60; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header>
    <h1>☕ Roastery Hub</h1>
    <p>Coffee Roasting & Operations Management</p>
  </header>

  <main>
    <div id="status">Connecting to Supabase...</div>

    <nav class="tabs" id="tabs">
      <button data-tab="roasts" class="active">Roast Batches</button>
      <button data-tab="inventory_items">Inventory</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="cupping_notes">Cupping Notes</button>
      <button data-tab="stock_outs">Stock Outs</button>
    </nav>

    <section class="panel">
      <h2 id="form-title">Add Roast Batch</h2>
      <form id="data-form">
        <div id="form-fields" class="form-grid"></div>
        <div class="form-actions">
          <button class="primary" type="submit">Save Record</button>
          <button type="reset">Clear Form</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2 id="list-title">Roast Batches</h2>
      <p class="muted">Records saved in your Supabase database.</p>
      <div id="records" class="records">Loading records...</div>
    </section>
  </main>

  <script>
    // 1. Replace these two values with your own Supabase credentials.
    const SUPABASE_URL = "https://vbqasghfmftdccgmggsn.supabase.co/rest/v1/";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oEVbIiRcvA0fp_gCoO3fJg_q-Ag2S3e";

    const dbClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    // These fields match the five tables you created.
    // id and created_at are managed by the database where configured.
    const configs = {
      roasts: {
        title: "Roast Batches",
        table: "roasts",
        fields: [
          { name: "bean_name", label: "Bean Name", required: true },
          { name: "roast_date", label: "Roast Date", type: "date", required: true },
          { name: "batch_name", label: "Batch Name" },
          { name: "quantity_kg", label: "Quantity (kg)", type: "number", step: "0.001" },
          { name: "notes", label: "Notes", type: "textarea" }
        ]
      },
      inventory_items: {
        title: "Inventory",
        table: "inventory_items",
        fields: [
          { name: "item_name", label: "Item Name", required: true },
          { name: "category", label: "Category", required: true },
          { name: "quantity", label: "Quantity", type: "number", step: "0.001", required: true },
          { name: "unit", label: "Unit (kg, pcs, bags...)", required: true }
        ]
      },
      orders: {
        title: "Orders",
        table: "orders",
        fields: [
          { name: "order_date", label: "Order Date", type: "date" },
          { name: "customer_name", label: "Customer Name" },
          { name: "items", label: "Items (JSON format)", type: "textarea",
            value: '[{"name":"Coffee beans","quantity":1}]', required: true },
          { name: "roast_id", label: "Roast ID (optional)", type: "number" },
          { name: "notes", label: "Notes", type: "textarea" }
        ]
      },
      cupping_notes: {
        title: "Cupping Notes",
        table: "cupping_notes",
        fields: [
          { name: "roast_id", label: "Roast ID (optional)", type: "number" },
          { name: "cup_number", label: "Cup Number" },
          { name: "cupping_date", label: "Cupping Date", type: "date" },
          { name: "dry_aroma", label: "Dry Aroma", type: "textarea" },
          { name: "wet_aroma", label: "Wet Aroma", type: "textarea" },
          { name: "acidity", label: "Acidity", type: "textarea" },
          { name: "body", label: "Body", type: "textarea" },
          { name: "notes", label: "Additional Notes", type: "textarea" }
        ]
      },
      stock_outs: {
        title: "Stock Outs",
        table: "stock_outs",
        fields: [
          { name: "item_id", label: "Inventory Item ID (optional)", type: "number" },
          { name: "quantity", label: "Quantity Used", type: "number", step: "0.001", required: true },
          { name: "stock_out_date", label: "Date", type: "date" },
          { name: "notes", label: "Notes", type: "textarea" }
        ]
      }
    };

    let activeTab = "roasts";
    let editingId = null;

    const statusEl = document.getElementById("status");
    const fieldsEl = document.getElementById("form-fields");
    const formEl = document.getElementById("data-form");
    const recordsEl = document.getElementById("records");

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#a3332a" : "#315d37";
      statusEl.style.background = isError ? "#fff0ed" : "#edf6ed";
    }

    function getErrorMessage(error) {
      return error?.message || String(error || "Unknown error");
    }

    function makeField(field) {
      const label = document.createElement("label");
      label.textContent = field.label + (field.required ? " *" : "");

      let input;
      if (field.type === "textarea") {
        input = document.createElement("textarea");
      } else {
        input = document.createElement("input");
        input.type = field.type || "text";
        if (field.step) input.step = field.step;
      }

      input.name = field.name;
      input.required = Boolean(field.required);
      input.dataset.field = field.name;

      if (field.value) input.value = field.value;

      label.appendChild(input);
      fieldsEl.appendChild(label);
    }

    function renderForm() {
      const config = configs[activeTab];
      document.getElementById("form-title").textContent =
        (editingId === null ? "Add " : "Edit ") + config.title;
      document.getElementById("list-title").textContent = config.title;

      fieldsEl.replaceChildren();
      config.fields.forEach(makeField);

      const submitButton = formEl.querySelector('[type="submit"]');
      submitButton.textContent = editingId === null ? "Save Record" : "Update Record";
    }

    function renderRecords(rows) {
      recordsEl.replaceChildren();

      if (!rows || rows.length === 0) {
        recordsEl.textContent = "No records found yet.";
        return;
      }

      rows.forEach(row => {
        const card = document.createElement("article");
        card.className = "record";

        const heading = document.createElement("h3");
        heading.textContent =
          row.bean_name || row.item_name || row.customer_name ||
          row.cup_number || ("Record #" + row.id);
        card.appendChild(heading);

        const details = document.createElement("pre");
        details.textContent = JSON.stringify(row, null, 2);
        card.appendChild(details);

        const actions = document.createElement("div");
        actions.className = "record-actions";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => startEdit(row));
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "danger";
        deleteButton.style.marginLeft = "8px";
        deleteButton.addEventListener("click", () => deleteRecord(row.id));
        actions.appendChild(deleteButton);

        card.appendChild(actions);
        recordsEl.appendChild(card);
      });
    }

    async function loadRecords() {
      recordsEl.textContent = "Loading records...";

      try {
        const { data, error } = await dbClient
          .from(configs[activeTab].table)
          .select("*")
          .order("id", { ascending: false })
          .limit(100);

        if (error) throw error;
        renderRecords(data);
        showStatus("Connected. " + configs[activeTab].title + " loaded.");
      } catch (error) {
        recordsEl.textContent = "Could not load records.";
        showStatus(
          "Database error: " + getErrorMessage(error) +
          " — Check table permissions, RLS policies, and column names.",
          true
        );
      }
    }

    function startEdit(row) {
      editingId = row.id;
      renderForm();

      configs[activeTab].fields.forEach(field => {
        const input = formEl.elements.namedItem(field.name);
        if (!input) return;

        const value = row[field.name];
        input.value = value == null
          ? ""
          : (typeof value === "object" ? JSON.stringify(value) : value);
      });

      formEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    formEl.addEventListener("reset", () => {
      editingId = null;
      setTimeout(renderForm, 0);
    });

    formEl.addEventListener("submit", async event => {
      event.preventDefault();

      const config = configs[activeTab];
      const payload = {};

      for (const field of config.fields) {
        const input = formEl.elements.namedItem(field.name);
        let value = input.value.trim();

        if (value === "") {
          payload[field.name] = null;
          continue;
        }

        if (field.type === "number") {
          value = Number(value);
          if (!Number.isFinite(value)) {
            showStatus("Invalid number for " + field.label, true);
            return;
          }
        }

        if (field.name === "items") {
          try {
            value = JSON.parse(value);
          } catch {
            showStatus("Items must be valid JSON, for example: [{\"name\":\"Beans\",\"quantity\":1}]", true);
            return;
          }
        }

        payload[field.name] = value;
      }

      // Remove empty nullable fields but preserve required numeric values.
      for (const field of config.fields) {
        if (payload[field.name] === null && field.required) {
          showStatus("Please fill in: " + field.label, true);
          return;
        }
      }

      try {
        showStatus("Saving record...");

        let result;
        if (editingId !== null) {
          result = await dbClient
            .from(config.table)
            .update(payload)
            .eq("id", editingId);
        } else {
          result = await dbClient
            .from(config.table)
            .insert(payload);
        }

        if (result.error) throw result.error;

        editingId = null;
        formEl.reset();
        renderForm();
        showStatus("Record saved successfully.");
        await loadRecords();
      } catch (error) {
        showStatus("Save failed: " + getErrorMessage(error), true);
      }
    });

    async function deleteRecord(id) {
      if (!confirm("Delete record #" + id + "? This cannot be undone.")) return;

      try {
        const { error } = await dbClient
          .from(configs[activeTab].table)
          .delete()
          .eq("id", id);

        if (error) throw error;

        showStatus("Record deleted.");
        await loadRecords();
      } catch (error) {
        showStatus("Delete failed: " + getErrorMessage(error), true);
      }
    }

    document.getElementById("tabs").addEventListener("click", event => {
      const button = event.target.closest("button[data-tab]");
      if (!button) return;

      activeTab = button.dataset.tab;
      editingId = null;

      document.querySelectorAll("#tabs button").forEach(tab => {
        tab.classList.toggle("active", tab === button);
      });

      formEl.reset();
      renderForm();
      loadRecords();
    });

    async function init() {
      renderForm();

      if (
        SUPABASE_URL.includes("YOUR_SUPABASE") ||
        SUPABASE_PUBLISHABLE_KEY.includes("YOUR_SUPABASE")
      ) {
        showStatus("Setup required: enter your Supabase URL and Publishable key in index.html.", true);
        recordsEl.textContent = "Waiting for Supabase configuration.";
        return;
      }

      await loadRecords();
    }

    init();
  </script>
</body>
</html>
