<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roastery Hub</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b1d14;--mut:#7a6a5d;--line:#e6dccf;--acc:#8a4b24;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--card:#271d17;--ink:#f3e9df;--mut:#b09c8c;--line:#3b2d24;--acc:#d08a55;--accink:#1c1511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1511;--card:#271d17;--ink:#f3e9df;--mut:#b09c8c;--line:#3b2d24;--acc:#d08a55;--accink:#1c1511;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button{flex:1 1 28%;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:2px}
.full{grid-column:1/-1}
.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-weight:600;font-size:16px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.pill{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:99px;padding:4px 10px;font-size:13px}
.x{border:0;background:none;color:var(--mut);font-size:13px;padding:4px}
#msg{color:var(--mut);font-size:13px;margin:0 0 10px}
#loginCard{max-width:420px;margin:24px auto}\n#loginCard h2{font-size:17px;margin:0 0 8px}
#loginError{color:#b42318;font-size:13px;margin-top:8px}
#accountbar{margin-bottom:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>☕ Roastery Hub</h1>
<div class="card" id="loginCard">
<h2>Sign in to Roastery Hub</h2>
<p class="m">Use your team’s shared account to access roasting, orders and inventory.</p>
<form id="loginForm">
<label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
<label style="margin-top:10px">Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
<button class="go" id="loginButton" type="submit">Sign in</button>
<p id="loginError" role="alert"></p>
</form>
</div>
<div id="app" hidden>
<div class="row" id="accountbar"><span class="m" id="accountLabel"></span><button class="pill" id="logoutButton" type="button">Sign out</button></div>
<p id="msg">Connecting…</p>
<nav id="nav"></nav>
<div class="card" id="form"></div>
<div id="list"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
var STATUS=["New","Roasting","Packed","Shipped","Paid"];
var TABS={
 orders:{label:"Orders",title:"New sales order",table:"orders"},
 roasts:{label:"Roasts",title:"Log a roast",table:"roasts"},
 cups:{label:"Cupping",title:"Cupping notes",table:"cupping_notes"},
 inventory:{label:"Inventory",title:"Manage inventory",table:"inventory_items"},
 stockouts:{label:"Stock Out",title:"Record stock out",table:"stock_outs"}
};
var state={orders:[],roasts:[],cups:[],inventory:[],stockouts:[]},tab="orders",db=null,editingOrderId=null,editingOrder=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function msg(t){document.getElementById("msg").textContent=t}
function today(){return new Date().toISOString().slice(0,10)}
function idNum(v){if(v==null||v==="")return null;var n=Number(v);return Number.isFinite(n)?n:null}
function parseExtra(v){if(!v)return{};if(typeof v==="object")return v;try{return JSON.parse(v)}catch(e){return{}}}
function nav(){var h="";Object.keys(TABS).forEach(function(k){h+='<button data-t="'+k+'" class="'+(k===tab?"on":"")+'">'+TABS[k].label+"</button>"});var n=document.getElementById("nav");n.innerHTML=h;n.querySelectorAll("button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;nav();form();list()}})}
function roastLabel(r){return [r.coffee,r.date,r.roaster].filter(Boolean).join(" · ")||"Roast"}
function options(list,labelFn,empty){return '<option value="">'+(empty||"— choose —")+'</option>'+list.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(labelFn(x))+'</option>'}).join("")}
function form(){
 var h="";
 if(tab==="orders"){
  h='<div class="t">New sales order</div><div class="grid">'+
  field("orderDate","Order date","date")+field("channel","Channel","select",["Shopee","WhatsApp / phone","Roastery book (wholesale)","Email","Other"])+
  field("customer","Customer","text")+field("ref","Order no.","text")+field("roastingDate","Roasting date","date")+field("completedDate","Completed date","date")+
  '<div class="full"><div class="row"><div class="t">Beans</div><button type="button" class="pill" id="addBean">+ Add beans line</button></div><div id="beanLines"></div></div>'+
  field("batchId","Roast batch used","select",state.roasts.map(function(r){return r.id+"|"+roastLabel(r)}),"full")+
  field("courier","Courier","text")+field("tracking","Courier ref. no.","text")+field("shipName","Ship to: name","text")+field("shipPhone","Ship to: phone","text")+field("shipAddress","Ship to: address","text","full")+field("notes","Notes","textarea","full")+'</div>';
 }else if(tab==="roasts"){
  h='<div class="t">Log a roast</div><div class="grid">'+field("date","Roast date","date")+field("roaster","Roaster","select",["P5","P12"])+field("coffee","Beans","text","full")+
  field("amb","Ambient temp (°C)","number")+field("hum","Humidity (%)","number")+field("inKg","Input weight (kg)","number")+field("outKg","Output weight (kg)","number")+field("tp","Turning point (min:sec)","text")+field("tpT","Turning point temp (°C)","number")+field("fc","First crack (min:sec)","text")+field("fcT","First crack temp (°C)","number")+field("drop","Ending time (min:sec)","text")+field("dropT","Ending temp (°C)","number")+field("agtron","Agtron bean / ground","text","full")+field("notes","Notes","textarea","full")+'</div>';
 }else if(tab==="cups"){
  h='<div class="t">Cupping notes</div><div class="grid">'+field("coffee","Beans / roast batch","select",state.roasts.map(function(r){return r.id+"|"+roastLabel(r)}),"full")+field("cupNumber","Cup number","text")+field("date","Cupping Date","date")+field("dryAroma","Dry Aroma","textarea","full")+field("wetAroma","Wet Aroma","textarea","full")+field("acidity","Acidity","textarea","full")+field("body","Body","textarea","full")+field("notes","Cupping notes","textarea","full")+'</div>';
 }else if(tab==="inventory"){
  h='<div class="t">Add inventory item</div><div class="grid">'+field("section","Section","select",["Green beans","Roasted beans","Packaging"])+field("item","Item / bean / packaging name","text","full")+field("unit","Unit","select",["g","kg","pcs","bags"])+field("quantity","Opening quantity","number")+field("notes","Notes","textarea","full")+'</div>';
 }else{
  h='<div class="t">Record stock out</div><div class="grid">'+field("date","Date","date")+field("itemId","Inventory item","select",state.inventory.map(function(i){return i.id+"|"+i.section+" — "+i.item+" ("+i.unit+")"}),"full")+field("quantity","Quantity out","number")+field("reason","Reason / order reference","text","full")+field("notes","Notes","textarea","full")+'</div>';
 }
 h+='<button class="go" id="save">Save</button>'+(tab==="orders"&&editingOrderId?'<button type="button" class="pill" id="cancelEdit" style="width:100%;margin-top:8px">Cancel editing</button>':"");document.getElementById("form").innerHTML=h;
 document.querySelectorAll("#form [data-k]").forEach(function(e){if(e.type==="date")e.value=today()});
 if(tab==="orders"){if(editingOrder&&String(editingOrder.id)===String(editingOrderId)){(editingOrder.beansLines||[]).forEach(function(item){addBeanLine(item)});if(!(editingOrder.beansLines||[]).length)addBeanLine();}else{addBeanLine()}document.getElementById("addBean").onclick=function(){addBeanLine()};}
 var batch=document.querySelector('#form [data-k="batchId"]');if(batch)batch.innerHTML=options(state.roasts,roastLabel,"— choose roast batch —");
 var cup=document.querySelector('#form [data-k="coffee"]');if(tab==="cups"&&cup)cup.innerHTML=options(state.roasts,roastLabel,"— choose roast batch —");
 var inv=document.querySelector('#form [data-k="itemId"]');if(inv)inv.innerHTML=options(state.inventory,function(i){return i.section+" — "+i.item+" ("+i.unit+")"},"— choose inventory item —");
 var sel=document.querySelector('#form [data-k="section"]');if(sel)sel.value="Green beans";
 if(tab==="orders"&&editingOrder){document.querySelectorAll("#form [data-k]").forEach(function(e){var v=editingOrder[e.dataset.k];if(v!==undefined&&v!==null)e.value=String(v)});var bsel=document.querySelector('#form [data-k="batchId"]');if(bsel&&editingOrder.batchId)bsel.value=String(editingOrder.batchId);}
 if(tab==="orders"&&editingOrderId){document.getElementById("save").textContent="Update order";var cancel=document.getElementById("cancelEdit");if(cancel)cancel.onclick=function(){editingOrderId=null;editingOrder=null;form();list();};}
 document.getElementById("save").onclick=save;
}
function field(k,label,type,opts,wide){
 var cls=wide==="full"||type==="textarea"?"full":"";
 var input=type==="select"?'<select data-k="'+k+'">'+(opts||[]).map(function(x){var v=x.indexOf("|")>=0?x.split("|")[0]:x,t=x.indexOf("|")>=0?x.substring(x.indexOf("|")+1):x;return '<option value="'+esc(v)+'">'+esc(t)+'</option>'}).join("")+'</select>':
 type==="textarea"?'<textarea rows="3" data-k="'+k+'"></textarea>':'<input data-k="'+k+'" type="'+type+'"'+(type==="number"?' step="any" inputmode="decimal"':"")+'>';
 return '<label class="'+cls+'">'+label+input+'</label>';
}
function addBeanLine(item){
 var box=document.getElementById("beanLines");if(!box)return;item=item||{};
 var div=document.createElement("div");div.className="card bean-line";
 div.innerHTML='<div class="grid">'+
 '<label class="full">Beans<input data-line="bean" type="text" placeholder="Bean name"></label>'+
 '<label>Packaging<select data-line="pack"><option>100g</option><option>150g</option><option>500g</option><option>1kg</option></select></label>'+
 '<label>Quantity<input data-line="qty" type="number" min="1" step="1" value="1"></label>'+
 '<label class="full">Roast date<select data-line="roast">'+options(state.roasts,roastLabel,"— choose roast date / batch —")+'</select></label>'+
 '<button type="button" class="x remove-line">Remove line</button></div>';
 div.querySelector(".remove-line").onclick=function(){div.remove()};box.appendChild(div);
 div.querySelector('[data-line="bean"]').value=item.bean||"";
 div.querySelector('[data-line="pack"]').value=item.packaging||"100g";
 div.querySelector('[data-line="qty"]').value=item.quantity||1;
 div.querySelector('[data-line="roast"]').value=item.roastId||"";
}
function toDbRow(which,d){
 var extra=Object.assign({},d);
 if(which==="orders")return {order_date:d.orderDate||today(),customer_name:d.customer||"",items:{beansLines:d.beansLines||[],app_data:extra},roast_id:idNum(d.batchId),notes:d.notes||null,app_data:extra};
 if(which==="roasts")return {bean_name:d.coffee||"",roast_date:d.date||today(),batch_name:d.roaster||null,quantity_kg:idNum(d.inKg),notes:d.notes||null,app_data:extra};
 if(which==="cups")return {roast_id:idNum(d.roastId||d.coffee),cup_number:d.cupNumber||null,cupping_date:d.date||today(),dry_aroma:d.dryAroma||null,wet_aroma:d.wetAroma||null,acidity:d.acidity||null,body:d.body||null,notes:d.notes||null,app_data:extra};
 if(which==="inventory")return {item_name:d.item||"",category:d.section||"Green beans",quantity:Number(d.quantity)||0,unit:d.unit||"kg",app_data:extra};
 return {item_id:idNum(d.itemId),quantity:Number(d.quantity)||0,stock_out_date:d.date||today(),notes:[d.reason,d.notes].filter(Boolean).join(" — ")||null,app_data:extra};
}
function fromDbRow(which,row){
 var extra=parseExtra(row.app_data);
 if(which==="orders")return Object.assign({},extra,{id:String(row.id),orderDate:row.order_date||extra.orderDate,customer:row.customer_name||extra.customer,beansLines:(extra.beansLines||(row.items&&row.items.beansLines)||[]),batchId:row.roast_id==null?(extra.batchId||""):String(row.roast_id),notes:row.notes||extra.notes||"",created:row.created_at||extra.created});
 if(which==="roasts")return Object.assign({},extra,{id:String(row.id),coffee:row.bean_name||extra.coffee,date:row.roast_date||extra.date,roaster:row.batch_name||extra.roaster,inKg:row.quantity_kg==null?extra.inKg:row.quantity_kg,notes:row.notes||extra.notes||"",created:row.created_at||extra.created});
 if(which==="cups")return Object.assign({},extra,{id:String(row.id),roastId:row.roast_id==null?(extra.roastId||""):String(row.roast_id),cupNumber:row.cup_number||extra.cupNumber,date:row.cupping_date||extra.date,dryAroma:row.dry_aroma||extra.dryAroma,wetAroma:row.wet_aroma||extra.wetAroma,acidity:row.acidity||extra.acidity,body:row.body||extra.body,notes:row.notes||extra.notes||"",created:row.created_at||extra.created});
 if(which==="inventory")return Object.assign({},extra,{id:String(row.id),item:row.item_name,section:row.category,quantity:row.quantity,unit:row.unit,notes:extra.notes||"",created:row.updated_at||extra.created});
 return Object.assign({},extra,{id:String(row.id),itemId:row.item_id==null?(extra.itemId||""):String(row.item_id),quantity:row.quantity,date:row.stock_out_date||extra.date,notes:extra.notes||"",reason:extra.reason||row.notes||"",created:row.created_at||extra.created});
}
async function loadAll(){
 try{
  var names=Object.keys(TABS);
  var results=await Promise.all(names.map(function(k){return db.from(TABS[k].table).select("*").order("id",{ascending:false}).limit(500)}));
  for(var i=0;i<names.length;i++){
   if(results[i].error)throw new Error(TABS[names[i]].table+": "+results[i].error.message);
   state[names[i]]=results[i].data.map(function(row){return fromDbRow(names[i],row)});
  }
  state.cups.forEach(function(c){if(c.roastId){var r=state.roasts.find(function(x){return String(x.id)===String(c.roastId)});if(r){c.roastLabel=roastLabel(r);if(!c.coffee)c.coffee=r.coffee}}});
  state.stockouts.forEach(function(s){if(s.itemId){var i=state.inventory.find(function(x){return String(x.id)===String(s.itemId)});if(i){s.itemLabel=s.itemLabel||i.section+" — "+i.item;s.unit=s.unit||i.unit}}});
  list();form();msg("Connected to Supabase · data loaded.");
 }catch(e){msg("Supabase error: "+(e&&e.message||String(e))+" · Check table permissions/RLS and app_data columns.");console.error(e)}
}
async function save(){
 if(!db){msg("Supabase is not configured.");return}
 var d={created:new Date().toISOString()},any=false;
 document.querySelectorAll("#form [data-k]").forEach(function(e){var v=e.value;if(e.type==="number"&&v!=="")v=Number(v);d[e.dataset.k]=v;if(v!==""&&e.type!=="date"&&e.tagName!=="SELECT")any=true});
 if(tab==="orders"){
  d.beansLines=Array.from(document.querySelectorAll(".bean-line")).map(function(x){return {bean:x.querySelector('[data-line="bean"]').value,packaging:x.querySelector('[data-line="pack"]').value,quantity:Number(x.querySelector('[data-line="qty"]').value)||1,roastId:x.querySelector('[data-line="roast"]').value}}).filter(function(x){return x.bean.trim()});
  if(!d.beansLines.length){msg("Please add at least one Beans line.");return}
  d.status="New";d.batchId=d.batchId||"";
 }else if(tab==="cups"){
  var r=state.roasts.find(function(x){return String(x.id)===String(d.coffee)});
  d.roastId=d.coffee;d.roastLabel=r?roastLabel(r):"";d.coffee=r?r.coffee:"";
 }else if(tab==="stockouts"){
  if(!(Number(d.quantity)>0)){msg("Enter a stock-out quantity greater than zero.");return}
  var inv=state.inventory.find(function(x){return String(x.id)===String(d.itemId)});
  if(!inv){msg("Choose an inventory item.");return}
  d.itemLabel=inv.section+" — "+inv.item;d.unit=inv.unit;
 }
 if(!any&&tab!=="orders"){msg("Please fill in the form.");return}
 try{
  msg("Saving…");
  var payload=toDbRow(tab,d);
  var result;
  if(tab==="orders"&&editingOrderId){result=await db.from("orders").update(payload).eq("id",Number(editingOrderId));}
  else{result=await db.from(TABS[tab].table).insert(payload);}
  if(result.error)throw result.error;
  var wasEditing=tab==="orders"&&!!editingOrderId;editingOrderId=null;editingOrder=null;
  msg(wasEditing?"Order updated successfully.":"Saved successfully.");await loadAll();
 }catch(e){msg("Could not save: "+(e&&e.message||String(e)));console.error(e)}
}
function line(a){return a.filter(function(x){return x!==""&&x!=null}).map(esc).join(" · ")}
function list(){
 var h="",items=state[tab]||[];
 if(tab==="inventory"){
  ["Green beans","Roasted beans","Packaging"].forEach(function(sec){
   h+='<div class="card"><div class="t">'+sec+'</div>';
   var its=state.inventory.filter(function(i){return i.section===sec});
   if(!its.length)h+='<p class="m">No items yet.</p>';
   its.forEach(function(i){var outs=state.stockouts.filter(function(s){return String(s.itemId)===String(i.id)}).reduce(function(a,s){return a+(Number(s.quantity)||0)},0);h+='<div class="card"><div class="t">'+esc(i.item)+'</div><div class="m">Opening: '+esc(i.quantity)+' '+esc(i.unit)+' · Stock out: '+outs+' '+esc(i.unit)+' · Available: '+((Number(i.quantity)||0)-outs)+' '+esc(i.unit)+'</div>'+(i.notes?'<div class="m">'+esc(i.notes)+'</div>':'')+'<button class="x" data-a="del" data-id="'+i.id+'">Delete</button></div>'});
   h+='</div>';
  });
 }else if(!items.length)h='<p class="m">Nothing logged yet.</p>';
 items.forEach(function(r){
  if(tab==="orders"){
   var beans=(r.beansLines||[]).map(function(b){var rr=state.roasts.find(function(x){return String(x.id)===String(b.roastId)});return [b.bean,b.packaging,b.quantity+" unit(s)",rr&&rr.date].filter(Boolean).join(" · ")}).map(esc).join("<br>");
   h+='<div class="card"><div class="row"><div><div class="t">'+esc(r.customer||"Customer")+(r.ref?' <span class="m">#'+esc(r.ref)+'</span>':"")+'</div><div class="m">'+line([r.channel,"Order: "+(r.orderDate||"—")])+'</div></div><button class="pill" data-a="next" data-id="'+r.id+'">'+esc(r.status||"New")+' ›</button></div><div class="m">'+line(["Roasting: "+(r.roastingDate||"—"),"Completed: "+(r.completedDate||"—")])+'</div><div class="m">'+beans+'</div>'+(r.courier||r.tracking||r.shipName||r.shipAddress?'<div class="m">'+line([r.courier,r.tracking,r.shipName,r.shipPhone,r.shipAddress])+'</div>':'')+(r.notes?'<div class="m">'+esc(r.notes)+'</div>':'')+'<button class="pill" data-a="edit" data-id="'+r.id+'">View / Edit order</button> <button class="x" data-a="del" data-id="'+r.id+'">Delete</button></div>';
  }else if(tab==="roasts"){
   var loss=r.inKg>0&&r.outKg>0?((r.inKg-r.outKg)/r.inKg*100).toFixed(1)+"% loss":"";
   h+='<div class="card"><div class="t">'+esc(r.coffee||"Roast")+'</div><div class="m">'+line([r.date,r.roaster,r.inKg+" → "+r.outKg+" kg",loss,"Batch: "+r.id])+'</div>'+(r.notes?'<div class="m">'+esc(r.notes)+'</div>':'')+'<button class="x" data-a="del" data-id="'+r.id+'">Delete</button></div>';
  }else if(tab==="cups"){
   h+='<div class="card"><div class="t">'+esc(r.roastLabel||r.coffee||"Cupping")+'</div><div class="m">'+line(["Cupping Date: "+(r.date||""),"Cup number: "+(r.cupNumber||"")])+'</div>'+["dryAroma","wetAroma","acidity","body","notes"].map(function(k){return r[k]?'<div class="m"><b>'+({dryAroma:"Dry Aroma",wetAroma:"Wet Aroma",acidity:"Acidity",body:"Body",notes:"Cupping notes"}[k])+':</b> '+esc(r[k])+'</div>':''}).join("")+'<button class="x" data-a="del" data-id="'+r.id+'">Delete</button></div>';
  }else if(tab==="stockouts"){
   h+='<div class="card"><div class="t">'+esc(r.itemLabel||"Stock out")+'</div><div class="m">'+line([r.date,r.quantity+" "+(r.unit||""),r.reason])+'</div>'+(r.notes?'<div class="m">'+esc(r.notes)+'</div>':'')+'<button class="x" data-a="del" data-id="'+r.id+'">Delete</button></div>';
  }
 });
 var L=document.getElementById("list");L.innerHTML=h;
 L.querySelectorAll("button[data-a]").forEach(function(b){b.onclick=async function(){
  var a=b.dataset.a,id=b.dataset.id,cur=items.find(function(x){return String(x.id)===String(id)});
  if(a==="edit"&&cur){editingOrderId=String(cur.id);editingOrder=Object.assign({},cur);tab="orders";nav();form();list();document.getElementById("form").scrollIntoView({behavior:"smooth",block:"start"});msg("Editing order #"+cur.id+". Update the fields and save.");
  }else if(a==="del"){
   if(!confirm("Delete this entry?"))return;
   try{var del=await db.from(TABS[tab].table).delete().eq("id",Number(id));if(del.error)throw del.error;await loadAll();msg("Entry deleted.")}catch(e){msg("Delete failed: "+e.message)}
  }else if(a==="next"&&cur){
   var i=STATUS.indexOf(cur.status||"New"),next=STATUS[(i+1)%STATUS.length],payload=toDbRow("orders",Object.assign({},cur,{status:next}));
   try{var upd=await db.from("orders").update({app_data:Object.assign({},cur,{status:next}),items:payload.items}).eq("id",Number(id));if(upd.error)throw upd.error;await loadAll();msg("Order status updated to "+next+".")}catch(e){msg("Status update failed: "+e.message)}
  }
 }});
}
function showSignedIn(email){
 document.getElementById("loginCard").hidden=true;
 document.getElementById("app").hidden=false;
 document.getElementById("accountLabel").textContent="Signed in · "+(email||"Shared team account");
}
function showSignedOut(){
 document.getElementById("loginCard").hidden=false;
 document.getElementById("app").hidden=true;
 document.getElementById("loginPassword").value="";
}
document.getElementById("loginForm").addEventListener("submit",async function(e){
 e.preventDefault();
 if(!db){document.getElementById("loginError").textContent="Supabase is not configured.";return}
 var button=document.getElementById("loginButton");
 button.disabled=true;button.textContent="Signing in…";
 document.getElementById("loginError").textContent="";
 try{
  var result=await db.auth.signInWithPassword({
   email:document.getElementById("loginEmail").value.trim(),
   password:document.getElementById("loginPassword").value
  });
  if(result.error)throw result.error;
  showSignedIn(result.data.user&&result.data.user.email);
  await loadAll();
 }catch(e){
  document.getElementById("loginError").textContent="Sign-in failed. Check the shared account email and password.";
  console.error(e);
 }finally{button.disabled=false;button.textContent="Sign in"}
});
document.getElementById("logoutButton").addEventListener("click",async function(){
 try{
  var result=await db.auth.signOut();
  if(result.error)throw result.error;
  showSignedOut();
  document.getElementById("loginError").textContent="";
 }catch(e){msg("Sign out failed: "+e.message)}
});
async function init(){
 try{
  if(!window.supabase||!window.ROASTERY_CONFIG)throw new Error("Missing Supabase SDK or config.js");
  var url=String(window.ROASTERY_CONFIG.url||"").replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,"");
  var key=window.ROASTERY_CONFIG.anonKey;
  if(!url||!key)throw new Error("Supabase URL or publishable key is missing");
  db=window.supabase.createClient(url,key);
  var sessionResult=await db.auth.getSession();
  if(sessionResult.error)throw sessionResult.error;
  nav();form();list();
  if(sessionResult.data.session){
   showSignedIn(sessionResult.data.session.user&&sessionResult.data.session.user.email);
   await loadAll();
  }else{
   showSignedOut();
   document.getElementById("loginError").textContent="";
  }
 }catch(e){
  document.getElementById("loginError").textContent="Connection failed: "+e.message;
  console.error(e);
 }
}
init();
</script>
